# Local Jenkins for learning — LTS + Java 21 (avoids Java 17 EOL warning).
# Usage:
#   docker compose -f docker-compose.jenkins.yml up -d
#   open http://localhost:8080
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: playwright-jenkins:lts-jdk21-node20
    container_name: jenkins
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home:
